name: Validar Atlas

on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-build-report
          path: |
            data/import-report.json
            dist/build-manifest.json
          retention-days: 14

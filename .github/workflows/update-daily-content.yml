name: Actualizar contenido diario

on:
  schedule:
    # GitHub programa en UTC. Dos candidatas cubren 00:30 de Madrid tanto
    # en verano (UTC+2) como en invierno (UTC+1); el paso TZ descarta la otra.
    - cron: "30 22 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      opusdei_backfill:
        description: "Descargar el histórico completo de meditaciones"
        required: false
        type: boolean
        default: false
      opusdei_from:
        description: "Fecha inicial opcional (AAAA-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: atlas-daily-content
  cancel-in-progress: false

jobs:
  daily-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar medianoche en Europe/Madrid
        id: madrid
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=$(node -e 'const h=Number(process.env.SCHEDULE.split(" ")[1]); const n=new Date(), d=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate(),h,30)); process.stdout.write(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Madrid",hour:"2-digit",hourCycle:"h23",minute:"2-digit"}).format(d)==="00:30"?"true":"false")')
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Actualizar 10 Minutos con Jesús
        if: steps.madrid.outputs.run == 'true'
        continue-on-error: true
        run: node tools/update-ten-minutes.mjs
      - name: Actualizar vídeos, música y noticias
        if: steps.madrid.outputs.run == 'true'
        run: node tools/refresh-daily-content.mjs
      - name: Descargar meditación diaria del Opus Dei
        if: steps.madrid.outputs.run == 'true'
        continue-on-error: true
        env:
          OPUSDEI_SOURCE_BASE: ${{ vars.OPUSDEI_SOURCE_BASE }}
          OPUSDEI_ARCHIVE_START: ${{ vars.OPUSDEI_ARCHIVE_START }}
          OPUSDEI_CF_ACCESS_CLIENT_ID: ${{ secrets.OPUSDEI_CF_ACCESS_CLIENT_ID }}
          OPUSDEI_CF_ACCESS_CLIENT_SECRET: ${{ secrets.OPUSDEI_CF_ACCESS_CLIENT_SECRET }}
          OPUSDEI_API_TOKEN: ${{ secrets.OPUSDEI_API_TOKEN }}
          BACKFILL: ${{ inputs.opusdei_backfill }}
          BACKFILL_FROM: ${{ inputs.opusdei_from }}
        shell: bash
        run: |
          if [ "$BACKFILL" = "true" ]; then
            node tools/update-opusdei-meditations.mjs --from "${BACKFILL_FROM:-2025-11-30}" --to "$(TZ=Europe/Madrid date +%F)" --strict
          else
            node tools/update-opusdei-meditations.mjs --date "$(TZ=Europe/Madrid date +%F)" --strict
          fi
      - name: Regenerar meditaciones del Evangelio si está disponible
        if: steps.madrid.outputs.run == 'true'
        shell: bash
        run: |
          if [ -f tools/build-gospel-meditations.mjs ]; then node tools/build-gospel-meditations.mjs; fi
      - name: Validar la PWA antes de guardar
        if: steps.madrid.outputs.run == 'true'
        run: npm run build
      - name: Publicar solo si hay cambios
        if: steps.madrid.outputs.run == 'true'
        shell: bash
        run: |
          git add data content/opusdei-meditations share
          if git diff --cached --quiet; then echo "No hay contenido nuevo."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: actualización diaria de Atlas"
          git push
